<!--
  promo-small.svg — Chrome Web Store 小型宣傳圖的向量來源（440x280）
  Small promo tile source.

  Created: 2026-08-05
  這張圖的工作是「讓人一眼認出品牌」，不是說明功能 —— 功能交給 1280x280 的截圖。
  因此只放圖示、名稱與一行標語，文字量刻意壓到最低：商店會把它縮放顯示，
  塞太多字在縮圖裡只會糊成灰色噪點。

  文字一律英文：manifest 的 default_locale 是 en，商店列表的預設語系也是 en。
  字型走通用 sans-serif 家族，不依賴任何需要下載的字型。

  產生 PNG：bash tools/build-promo.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <!-- 背景光暈：偏右上，讓視覺重心落在圖示與標題之間，不搶字 -->
    <radialGradient id="glow" cx="72%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#12233f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7CF6"/>
      <stop offset="100%" stop-color="#1550C0"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="#0a0b0e"/>
  <rect width="440" height="280" fill="url(#glow)"/>

  <!--
    圖示：與 icons/icon.svg 同一套圖形，等比放大到 104px 置於左側。
    y 座標刻意讓圖示的垂直中心（88+52=140）對齊右側文字區塊的視覺中心（約 142），
    而不是各自對齊畫布中線 —— 兩個高度不同的區塊各自置中會看起來錯開。
  -->
  <g transform="translate(44, 88) scale(0.8125)">
    <rect width="128" height="128" rx="28" fill="url(#tile)"/>
    <g fill="#FFFFFF" stroke="#FFFFFF">
      <line x1="45" y1="45" x2="83" y2="83" stroke-width="13" stroke-linecap="round"/>
      <path d="M26 26 H68 L26 68 Z"/>
      <path d="M102 102 H60 L102 60 Z"/>
    </g>
  </g>

  <!-- 標題區 -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="176" y="114" fill="#FFFFFF" font-size="34" font-weight="700" letter-spacing="-0.8">
      Auto Resizer
    </text>
    <text x="177" y="144" fill="#94A0B8" font-size="19" font-weight="500" letter-spacing="0.2">
      for YouTube™
    </text>

    <!--
      分隔線：短一截，收在標語左緣，避免整條橫貫顯得像表格。
      3px 而非 2px —— 商店會把這張圖縮小顯示，2px 的線在縮圖裡等於不存在（實測像素取樣確認過）。
    -->
    <rect x="177" y="161" width="40" height="3" rx="1.5" fill="#2E7CF6"/>

    <text x="177" y="190" fill="#7C93C4" font-size="14" font-weight="500" letter-spacing="0.3">
      4K · Multi-monitor · No black bars
    </text>
  </g>
</svg>
