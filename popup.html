<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Auto Resizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="youtube-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <div class="title-group">
          <h1>Auto Resizer</h1>
          <span class="badge">v2.3</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Main Settings -->
    <main class="content">
      <!-- Quality Selector -->
      <section class="section">
        <label class="section-label">預設優先畫質</label>
        <select id="quality-select" class="select-input">
          <option value="auto" selected>Auto (交給 YouTube 自動判斷)</option>
          <option value="2160p">4K (2160p)</option>
          <option value="1440p">2K (1440p)</option>
          <option value="1080p">Full HD (1080p)</option>
          <option value="720p">HD (720p)</option>
          <option value="480p">SD (480p)</option>
        </select>
        <p class="section-hint">選定畫質後，每支新影片會自動鎖定到該畫質；若該影片沒有此畫質，則取可用的最高畫質。</p>
      </section>

      <!-- Resize Mode -->
      <section class="section">
        <label class="section-label">播放器尺寸縮放模式</label>
        <div class="mode-options">
          <label class="mode-card">
            <input type="radio" name="resizeMode" value="autoByQuality" checked>
            <div class="mode-box">
              <span class="mode-title">⚡ 依畫質自動匹配尺寸</span>
              <span class="mode-desc">以影片原生解析度為上限，再收斂到視窗可容納的大小</span>
            </div>
          </label>
          <label class="mode-card">
            <input type="radio" name="resizeMode" value="fitWindow">
            <div class="mode-box">
              <span class="mode-title">強制視窗貼合 (Fit)</span>
              <span class="mode-desc">不論畫質一律撐滿視窗可用空間</span>
            </div>
          </label>
          <label class="mode-card">
            <input type="radio" name="resizeMode" value="theater">
            <div class="mode-box">
              <span class="mode-title">強制劇院模式</span>
              <span class="mode-desc">播放器滿寬，推薦影片移到下方</span>
            </div>
          </label>
          <label class="mode-card">
            <input type="radio" name="resizeMode" value="default">
            <div class="mode-box">
              <span class="mode-title">預設小圖</span>
              <span class="mode-desc">維持 YouTube 原生尺寸</span>
            </div>
          </label>
        </div>
      </section>

      <!-- Display Awareness -->
      <section class="section" aria-labelledby="display-section-label">
        <label class="section-label" id="display-section-label">螢幕適配</label>
        <ul class="display-list" id="display-list">
          <li class="display-row display-row--empty">偵測顯示器中…</li>
        </ul>
        <label class="checkbox-label">
          <input type="checkbox" id="displayAwareQuality-toggle" checked>
          <span>依螢幕解析度自動提升畫質</span>
        </label>
        <select id="autoQualityCeiling-select" class="select-input" aria-label="自動畫質上限">
          <option value="hd2160">自動畫質上限：4K (2160p)</option>
          <option value="hd1440">自動畫質上限：2K (1440p)</option>
          <option value="hd1080">自動畫質上限：Full HD (1080p)</option>
          <option value="hd720">自動畫質上限：HD (720p)</option>
        </select>
        <p class="section-hint">依「播放器寬度 × 螢幕像素密度」推算需要的畫質。只有在影片本身沒有更高畫質時，才會超過原生解析度放大來填滿畫面。設為「自動」以外的預設優先畫質時，一律以你指定的為準。</p>
      </section>

      <!-- Pop-up Player Placement -->
      <section class="section" aria-labelledby="popup-target-label">
        <label class="section-label" id="popup-target-label">彈出播放器開啟位置</label>
        <select id="popupTargetDisplay-select" class="select-input" aria-labelledby="popup-target-label">
          <option value="follow">跟隨目前視窗所在的螢幕</option>
          <option value="largest">一律開在最大的螢幕</option>
          <option value="internal">一律開在內建螢幕</option>
        </select>
      </section>

      <!-- Extra Toggles -->
      <section class="section checklist">
        <label class="checkbox-label">
          <input type="checkbox" id="removeSideGaps-toggle" checked>
          <span>自動消除播放器兩側留白區</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="resizeMainWindow-toggle">
          <span>同步調整瀏覽器視窗尺寸</span>
        </label>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="dot"></span>
        <span id="status-text">運作中</span>
      </div>
      <div class="sponsor-link">
        <a href="https://www.paypal.me/boboidvtw" target="_blank" rel="noopener noreferrer">❤️ 支持贊助</a>
      </div>
    </footer>
  </div>

  <script src="src/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
