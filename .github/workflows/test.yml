# test.yml — 單元測試與擴充功能封裝完整性的 CI 守門
# Created: 2026-08-05
#
# 只跑得動單元測試：e2e 需要真實的 Brave 實例與真實的 YouTube，在 runner 上會被
# 機器人驗證牆擋下（實測），把它放進 CI 只會製造無法信任的紅燈。e2e 仍是本機發版前必跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 是目前的 LTS 下限，24 是新版。`--test` 對路徑參數的行為在版本之間變過，
        # 跑兩個版本才擋得住「本機這版能跑、CI 那版不能」。
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: 單元測試（含 _locales 一致性）
        # glob 刻意不加引號，交給 shell 展開成實際檔案清單。
        # 加引號的話等於把 glob 原樣丟給 node：Node 20 當成字面路徑找不到檔案，
        # Node 26 又會把 `tests/` 當模組去 require —— 兩種版本兩種壞法（都實測過）。
        run: node --test tests/*.test.js

      - name: manifest.json 必須是合法 JSON，且版本號與 CHANGELOG 對得上
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "manifest 版本：$version"
          grep -q "## \[$version\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md 找不到 [$version] 的段落 —— 發版時漏寫紀錄了"
            exit 1
          }

      - name: 打包清單完整，且不含開發用檔案
        run: bash tools/package.sh

      - name: 擴充功能不得含有對外連線
        run: |
          # 這條守的是隱私承諾本身。PRIVACY.md 宣稱「沒有任何對外連線」，
          # 而承諾若沒有守門，總有一天會在某次「順手加個統計」時默默失效。
          #
          # 掃描範圍取自 tools/package.sh 的 SHIP 清單，也就是真正會進 zip 的檔案。
          # 不能掃整個 repo：tests/ 與 tools/ 都合法地用 fetch 驅動 CDP，
          # 那些不會被打包，掃它們只會製造假警報（本次 CI 就誤報過一次）。
          #
          # 清單為空必須大聲失敗，不可當成「沒違規」。`echo "" | xargs grep` 會讓 grep
          # 讀到空 stdin 而直接回報無匹配，於是 package.sh 改壞、SHIP 清單被清空、或副檔名
          # 篩選失準時，這道守門會退化成永遠綠燈 —— 還會理直氣壯地印「確認 1 個檔案」。
          # 兩道防線：list 用 set -e 擋 package.sh 本身失敗，files 空則自己 exit 1。
          list=$(bash tools/package.sh --list)
          files=$(echo "$list" | grep -E '\.(js|html)$' || true)
          if [ -z "$files" ]; then
            echo "::error::打包清單裡找不到任何 .js/.html —— 掃描範圍為空，這道守門等於沒跑"
            exit 1
          fi
          count=$(echo "$files" | wc -l | tr -d ' ')
          hits=$(echo "$files" | xargs grep -nE "fetch\(|XMLHttpRequest|navigator\.sendBeacon" || true)
          if [ -n "$hits" ]; then
            echo "::error::打包檔案裡發現對外連線的呼叫，與 PRIVACY.md 的承諾牴觸："
            echo "$hits"
            exit 1
          fi
          echo "確認 $count 個打包檔案中無對外連線呼叫"

      - name: manifest 宣告的圖示都要存在，且尺寸正確
        run: |
          # 刻意不比對 PNG 的位元組：ubuntu 的 librsvg 與開發機 homebrew 的版本輸出未必
          # 逐位元組相同，那種比對只會製造一條永遠紅、最後被大家忽略的檢查。
          # 這裡守的是「檔案在、尺寸對」，改圖後要重跑 build.sh 由 README 與 build.sh 說明承擔。
          node -e '
            const fs = require("fs");
            const icons = require("./manifest.json").icons;
            let bad = 0;
            for (const [size, file] of Object.entries(icons)) {
              if (!fs.existsSync(file)) {
                console.error(`::error::manifest 宣告的 ${file} 不存在`); bad++; continue;
              }
              // PNG 的 IHDR 寬高固定在位元組 16..24
              const buf = fs.readFileSync(file);
              const w = buf.readUInt32BE(16), h = buf.readUInt32BE(20);
              if (w !== Number(size) || h !== Number(size)) {
                console.error(`::error::${file} 是 ${w}x${h}，manifest 宣告的是 ${size}`); bad++;
              } else {
                console.log(`${file} ${w}x${h} 正確`);
              }
            }
            if (!fs.existsSync("icons/icon.svg")) {
              console.error("::error::缺少向量來源 icons/icon.svg"); bad++;
            }
            process.exit(bad ? 1 : 0);
          '

      - name: 商店素材尺寸必須符合規格
        run: |
          # 商店對素材尺寸零容忍，差一像素就退件，而錯誤尺寸從檔案總管看不出來。
          node tools/png-geometry.js store-assets/01-watch-page.png --expect-size 1280x800
          node tools/png-geometry.js store-assets/02-settings-panel.png --expect-size 1280x800
          node tools/png-geometry.js store-assets/promo-small-440x280.png --expect-size 440x280

      - name: 商店圖示的留白必須符合規格
        run: |
          # 單獨一條，因為它守的不是尺寸而是**留白**：商店圖示要求圖形只佔中央 96x96、
          # 四周 16px 透明邊。忘了留白的輸出照樣是 128x128，只驗尺寸完全擋不住，
          # 而拿 manifest 的滿版 icons/icon.png 去填商店正是最容易犯的那個錯。
          node tools/png-geometry.js store-assets/store-icon-128.png \
            --expect-size 128x128 --expect-content 16,16,96,96
          # 反向確認這條檢查真的有在守：滿版的 manifest 圖示必須被判為不合格。
          # 沒有這行的話，png-geometry.js 哪天退化成「永遠回傳通過」也不會有人發現。
          if node tools/png-geometry.js icons/icon.png \
               --expect-size 128x128 --expect-content 16,16,96,96 2>/dev/null; then
            echo "::error::留白檢查失效——滿版的 icons/icon.png 竟然通過了商店圖示規格"
            exit 1
          fi
          echo "留白檢查的負向驗證通過（滿版圖示如預期被擋下）"
